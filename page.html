<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShop - E-Commerce</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
        }

        /* Navbar */
        nav {
            background: #222;
            color: white;
            padding: 15px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #ff9800;
        }

        .search {
            width: 40%;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
        }

        /* Hero */
        .hero {
            background: linear-gradient(120deg, #ff9800, #ff5722);
            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .shop-btn {
            background: white;
            color: #ff5722;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        /* Products */
        .products {
            padding: 40px 8%;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 30px;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product-info h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #ff5722;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .buy-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: #ff9800;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .buy-btn:hover {
            background: #e68900;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .product-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .search {
                width: 30%;
            }
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .search {
                width: 100%;
            }

            nav ul {
                gap: 15px;
            }

            .product-container {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">MyShop</div>

        <input 
            type="text" 
            class="search" 
            placeholder="Search products..."
        >

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Cart 🛒</a></li>
            <li><a href="#">Login</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to MyShop</h1>
        <p>Find the best products at the best prices.</p>
        <a href="#products" class="shop-btn">Shop Now</a>
    </section>

    <!-- Products -->
    <section class="products" id="products">
        <h2>Featured Products</h2>

        <div class="product-container">

            <!-- Product 1 -->
            <div class="product">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80">

                <div class="product-info">
                    <h3>Sport Shoes</h3>
                    <p class="price">$45.00</p>
                    <button class="buy-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="product">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80">

                <div class="product-info">
                    <h3>Smart Watch</h3>
                    <p class="price">$80.00</p>
                    <button class="buy-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="product">
                <img src="https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?auto=format&fit=crop&w=500&q=80">

                <div class="product-info">
                    <h3>Fashion Clothes</h3>
                    <p class="price">$35.00</p>
                    <button class="buy-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="product">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80">

                <div class="product-info">
                    <h3>Headphones</h3>
                    <p class="price">$55.00</p>
                    <button class="buy-btn">Add to Cart</button>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 MyShop. All Rights Reserved.</p>
    </footer>

</body>
</html>
