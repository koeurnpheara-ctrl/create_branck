<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .container{
            width:350px;
        }

        .signup-form{
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 10px 20px rgba(0,0,0,0.2);
        }

        .signup-form h2{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        .signup-form input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        .signup-form input:focus{
            outline:none;
            border-color:#2196f3;
        }

        .signup-form button{
            width:100%;
            padding:12px;
            margin-top:10px;
            background:#2196f3;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .signup-form button:hover{
            background:#1976d2;
        }

        .signup-form p{
            text-align:center;
            margin-top:15px;
            color:#555;
        }

        .signup-form a{
            color:#2196f3;
            text-decoration:none;
            font-weight:bold;
        }

        .signup-form a:hover{
            text-decoration:underline;
        }
    </style>

</head>
<body>

<div class="container">
    <form class="signup-form">
        <h2>Create Account</h2>

        <input type="text" placeholder="Full Name" required>

        <input type="email" placeholder="Email Address" required>

        <input type="password" placeholder="Password" required>

        <input type="password" placeholder="Confirm Password" required>

        <button type="submit">Sign Up</button>

        <p>
            Already have an account?
            <a href="#">Sign In</a>
        </p>
    </form>
</div>

</body>
</html>
